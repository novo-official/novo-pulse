# ---------------------------------------------------------------------------
# Novo Pulse - Data Contract
# ---------------------------------------------------------------------------
# This file is the ONLY thing that has to change when the real competition
# dataset arrives. Nothing in backend/ml/ hard-codes a synthetic column name.
# ---------------------------------------------------------------------------

dataset:
  name: synthetic_pol_e_chaharom
  # Path is relative to the repository root (or absolute).
  path: data/synthetic/daily_demand.csv
  # Optional side tables that get joined on their key columns.
  joins:
    - path: data/synthetic/accommodations.csv
      "on": accommodation_id
    - path: data/synthetic/destinations.csv
      "on": destination_id
    - path: data/synthetic/calendar.csv
      "on": date

schema:
  timestamp: date
  target: booking_count
  entity_id: accommodation_id
  frequency: D          # D | W | M | H  (null => auto-detect)
  # How to collapse duplicate (entity, timestamp) rows.
  aggregation: sum

hierarchy:
  # Every level is optional. Missing levels are simply skipped.
  destination: destination_id
  category: category
  # `market` is always synthesised as the grand total.

# Display-only names. These columns never become model features - they only
# make the dashboard readable in Persian.
labels:
  destination_id: destination_name
  category: category_fa

features:
  # Known at prediction time for future dates (calendar, planned price, ...)
  future:
    - price
    - is_holiday
    - is_weekend
    - is_event
    - is_promotion
    - available_capacity
  # Only known historically - used through lags/rollings, never at t+h.
  historical:
    - search_count
    - view_count
  # Constant per entity.
  static:
    - category
    - capacity
    - rating
    - bedrooms
    - base_price
    - destination_type
    - province
  ignored:
    # `latent_demand` is the synthetic ground truth behind the censoring. It is
    # deliberately withheld from the models so the demo stays honest - a real
    # dataset would never contain it.
    - latent_demand
    - reserved_nights
    - holiday_name
    - event_name

target_options:
  # Target is count-like -> clip negatives, allow Tweedie/Poisson objectives.
  non_negative: true
  integer: true
  log1p_transform: auto     # auto | true | false
  # Observed demand may be capped by capacity (censoring). Requires the column.
  censoring_column: available_capacity
  censoring_enabled: true

evaluation:
  primary_metric: wape
  secondary_metrics: [mae, rmse, smape, mape, r2]
  horizons: [7, 14, 30, 60, 90]
  horizon_buckets:
    - [1, 7]
    - [8, 14]
    - [15, 30]
    - [31, 60]
    - [61, 90]
  cv:
    n_folds: 3
    step: 30          # days between fold origins (null => horizon)
  quantiles: [0.1, 0.5, 0.9]
